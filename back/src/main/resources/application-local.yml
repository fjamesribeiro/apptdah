spring:
  datasource:
    username: postgres
    password: adm1in@8042
    url: jdbc:postgresql://db.hnmyxslmrrsbgljlvxmr.supabase.co:5432/postgres
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://hnmyxslmrrsbgljvxmr.supabase.co/auth/v1
          jwk-set-uri: https://hnmyxslmrrsbgljvxmr.supabase.co/auth/v1/keys

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect # Dialeto SQL do PostgreSQL
        default_schema: apptdah
        format_sql: true
        hbm2ddl:
          auto: update # Pode ser 'create', 'create-drop' ou 'update'

server:
  port: 8082
  error:
    include-stacktrace: never

logging:
  file:
    name: logs/spring.log
  logback:
    rollingpolicy:
      total-size-cap: 100MB
      max-history: 30
      max-file-size: 10MB
      file-name-pattern: logs/archive/spring.%d{yyyy-MM-dd}.%i.log
  level:
    root: info
